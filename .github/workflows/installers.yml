# Builds the Timetracker Redmine installers on each OS (Linux .deb, Windows .exe, macOS .dmg).
# Run it by hand from the Actions tab (artifacts only), or push a tag like "v0.1.0":
# then the installers and their SHA256SUMS are also attached to that GitHub release.
name: installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: dist:linux
            files: instaladores/*.deb
          - os: windows-latest
            target: dist:win
            files: instaladores/*.exe
          - os: macos-latest
            target: dist:mac
            files: instaladores/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # signed build provenance (attestations)
      attestations: write
    env:
      # Unsigned builds: no code-signing certificates are configured.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.target }} -- --publish never
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.files }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetracker-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create or update the release
        working-directory: release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "Timetracker Redmine ${TAG#v}" --generate-notes
          gh release upload "$TAG" * --clobber
