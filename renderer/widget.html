<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="widget.css">
</head>
<body>
  <div class="bar">
    <button id="toggle" class="btn play" title="Iniciar/parar">▶</button>
    <div id="task" class="task" title="Abrir buscador">
      <div id="title" class="title">Sin tarea</div>
      <div id="sub" class="sub">Pulsa aquí para buscar una tarea</div>
    </div>
    <div class="times">
      <div id="timer" class="timer">0:00:00</div>
      <div id="today" class="today">hoy 0:00</div>
    </div>
    <button id="menu" class="btn small" title="Menú">⋮</button>
  </div>
  <div id="prompt" class="prompt hidden">
    <span id="promptText"></span>
    <button data-c="keep">Sumar</button>
    <button data-c="discard">Descartar</button>
    <button data-c="stop">Parar</button>
  </div>
  <form id="comment" class="prompt hidden">
    <input id="commentText" maxlength="500" autocomplete="off">
    <button data-c="keep">Guardar</button>
    <button type="button" id="commentSkip" title="Parar y poner el comentario más tarde, en Revisión del día">Luego</button>
    <button type="button" id="commentCancel" title="No parar: el contador sigue corriendo">Cancelar</button>
  </form>
  <script src="widget.js"></script>
</body>
</html>
